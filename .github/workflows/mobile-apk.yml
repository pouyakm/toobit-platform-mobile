name: mobile-apk

# Layout-agnostic: finds the Expo app folder automatically (repo root, mobile/, or any subfolder up to 4 levels deep).
# Builds an installable Android APK on GitHub-hosted runners (no Expo/EAS account needed).
# Run manually (Actions tab -> mobile-apk -> Run workflow) or push a tag like mobile-v1.0.0 to also create a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Default server address shown on the login screen (https://... recommended)
        required: false
        default: ''
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only used to attach the APK to a Release on tag builds
    env:
      ALLOW_CLEARTEXT: '0'   # release APKs never allow plain http
      VERSION_CODE: ${{ github.run_number }}
      DEFAULT_API_BASE_URL: ${{ inputs.api_base_url || vars.DEFAULT_API_BASE_URL || 'https://example.invalid' }}
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Expo app
        id: locate
        run: |
          set -euo pipefail
          APP=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if grep -q '"expo"' "$f" && { [ -f "$d/app.config.ts" ] || [ -f "$d/app.config.js" ] || [ -f "$d/app.json" ]; }; then APP="$d"; break; fi
          done < <(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | sort)
          if [ -z "$APP" ]; then
            echo "::error::No Expo app found (package.json with expo + app.config.*). Repository contents:"
            find . -maxdepth 3 -not -path './.git*' -not -path '*/node_modules*' | head -60
            exit 1
          fi
          echo "Expo app at: $APP"
          echo "APP_DIR=$APP" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4   # tolerant of a missing lockfile (setup-node's cache option hard-fails without one)
        with:
          path: ~/.npm
          key: npm-mobile-${{ runner.os }}-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: npm-mobile-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
        working-directory: ${{ env.APP_DIR }}
      - run: npm test -- --ci
        working-directory: ${{ env.APP_DIR }}

      # Generates the native android/ project from app.config.ts (it is not committed).
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: ${{ env.APP_DIR }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon

      # Signing: with the 4 secrets below the APK is signed with YOUR release key (required for stable updates / Play).
      # Without them it keeps the template's debug signature: fine for testing, NOT for distribution.
      - name: Sign APK with release key (if secrets are set)
        working-directory: ${{ env.APP_DIR }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p "$RUNNER_TEMP/out"
          OUT="$RUNNER_TEMP/out/toobit-mobile-${GITHUB_RUN_NUMBER}.apk"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KP_VAR=KEY_PASS; [ -n "${KEY_PASS:-}" ] || KP_VAR=KS_PASS   # key password defaults to the store password
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass "env:${KP_VAR}" \
              --out "$OUT" "$SRC"
            "$BT/apksigner" verify --print-certs "$OUT" | head -n3
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No release keystore secrets set: APK is debug-signed (testing only)."
            cp "$SRC" "$OUT"
          fi
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: toobit-mobile-apk
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
