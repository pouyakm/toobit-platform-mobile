name: mobile-apk

# Builds an installable Android APK on GitHub-hosted runners (no Expo/EAS account needed).
# Run manually (Actions tab -> mobile-apk -> Run workflow) or push a tag like mobile-v1.0.0 to also create a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Default server address shown on the login screen (https://... recommended)
        required: false
        default: ''
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only used to attach the APK to a Release on tag builds
    defaults: { run: { working-directory: mobile } }
    env:
      ALLOW_CLEARTEXT: '0'   # release APKs never allow plain http
      VERSION_CODE: ${{ github.run_number }}
      DEFAULT_API_BASE_URL: ${{ inputs.api_base_url || vars.DEFAULT_API_BASE_URL || 'https://example.invalid' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

      # Generates the native android/ project from app.config.ts (it is not committed).
      - run: npx expo prebuild --platform android --no-install --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # Signing: with the 4 secrets below the APK is signed with YOUR release key (required for stable updates / Play).
      # Without them it keeps the template's debug signature: fine for testing, NOT for distribution.
      - name: Sign APK with release key (if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p "$RUNNER_TEMP/out"
          OUT="$RUNNER_TEMP/out/toobit-mobile-${GITHUB_RUN_NUMBER}.apk"
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KP_VAR=KEY_PASS; [ -n "${KEY_PASS:-}" ] || KP_VAR=KS_PASS   # key password defaults to the store password
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass "env:${KP_VAR}" \
              --out "$OUT" "$SRC"
            "$BT/apksigner" verify --print-certs "$OUT" | head -n3
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No release keystore secrets set: APK is debug-signed (testing only)."
            cp "$SRC" "$OUT"
          fi
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: toobit-mobile-apk
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
