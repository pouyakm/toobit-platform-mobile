server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/ { proxy_pass http://api:8080; proxy_set_header X-Correlation-Id $request_id; proxy_set_header Host $host; }
  location /health/ { proxy_pass http://api:8080; }
  location / { try_files $uri /index.html; }   # SPA fallback
}
