# Overlay for staging/prod single-VM deployments: pulls pinned images instead of building, no dev bootstrap, no published DB/Redis ports.
# Usage on the VM:  IMAGE_TAG=<git-sha> docker compose -f docker-compose.yml -f deploy/compose.prod.yml pull && ... up -d
services:
  api:
    image: ghcr.io/${GHCR_OWNER}/toobit-api:${IMAGE_TAG}
    build: !reset null
    environment:
      Db__EnsureCreated: "false"          # schema is owned by EF migrations (applied by the CD job BEFORE this rollout)
    restart: unless-stopped
  analytics:
    image: ghcr.io/${GHCR_OWNER}/toobit-analytics:${IMAGE_TAG}
    build: !reset null
    restart: unless-stopped
  web:
    image: ghcr.io/${GHCR_OWNER}/toobit-web:${IMAGE_TAG}
    build: !reset null
    restart: unless-stopped
  postgres: { restart: unless-stopped }
  redis: { restart: unless-stopped }
