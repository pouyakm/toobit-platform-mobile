# docker compose up                              -> postgres, redis, api, analytics, web
# docker compose --profile observability up      -> + jaeger, prometheus, grafana
# docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up   -> + WireMock simulated Toobit (see e2e/smoke.sh)
name: toobit

x-env: &common-env
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  analytics:
    build: ./analytics
    <<: *common-env
    volumes: ["models:/models:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    <<: *common-env
    environment:
      Db__EnsureCreated: "true"            # DEV ONLY. Staging/prod use EF migrations (see RUNBOOKS/rollback.md).
      Analytics__BaseUrl: http://analytics:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      analytics: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      # The runtime image has no curl; probe with bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s                 # graceful shutdown: drain in-flight orders, flush telemetry, close WS

  web:
    build: ./frontend
    depends_on: { api: { condition: service_healthy } }
    ports: ["8081:8080"]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    volumes: ["./observability/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.0
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}", GF_USERS_ALLOW_SIGN_UP: "false" }
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  models:
